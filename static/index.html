<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0874be">
  <meta name="description" content="내 주변 동구랑페이 가맹점을 쉽고 빠르게 찾아보세요.">
  <title>동구랑페이 가맹점 지도</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="brand-bar">
      <a class="brand" href="#" aria-label="동구랑페이 홈">
        <img class="brand-logo" src="./donggu-logo.jpg" alt="전남광주통합특별시 동구">
        <span><strong>동구랑<span>페이</span></strong><small>전남광주통합특별시 동구 지역화폐</small></span>
      </a>
      <div class="header-actions">
        <a class="admin-link" href="./admin.html">관리자</a>
      </div>
    </header>

    <main class="workspace" data-sheet-level="compact">
      <section class="search-panel" aria-label="가맹점 검색">
        <button class="panel-handle" id="panelHandle" type="button" aria-label="가맹점 목록 크게 펼치기" aria-expanded="true" aria-controls="merchantList"><span></span></button>
        <div class="brand-card" aria-label="동구랑페이 브랜드 안내">
          <img src="./donggu-pay-card.png" alt="광주동구랑 페이 공식 카드 디자인">
        </div>

        <form class="search-form" id="searchForm">
          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg>
            <input id="searchInput" type="search" autocomplete="off" placeholder="가맹점명 또는 주소를 입력하세요" aria-label="가맹점명 또는 주소">
            <button class="search-clear" type="button" data-clear-search="searchInput" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
            <button class="search-submit" type="submit" aria-label="검색">검색</button>
          </label>
          <p class="search-hint" id="searchHint">상호명, 주소, 업종을 함께 검색합니다.</p>
        </form>

        <div class="panel-status">
          <strong id="listTitle">가맹점 목록</strong>
          <button id="clearSelectionButton" type="button" hidden>전체 목록</button>
          <button id="sortButton" type="button">가까운 순 <span>⌄</span></button>
        </div>

        <div class="merchant-list" id="merchantList" aria-live="polite"></div>
      </section>

      <section class="map-area" aria-label="가맹점 지도">
        <div id="map"></div>
        <div class="map-topbar">
          <form class="mobile-search-form" id="mobileSearchForm" role="search">
            <input id="mobileSearchInput" type="search" autocomplete="off" placeholder="가맹점명 · 주소 검색" aria-label="가맹점명 또는 주소">
            <button class="search-clear" type="button" data-clear-search="mobileSearchInput" aria-label="검색어 지우기" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg></button>
            <button type="submit" aria-label="검색"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16 16 4 4"></path></svg></button>
          </form>
          <div class="category-filters mobile-category-filters" role="group" aria-label="업종 선택"></div>
        </div>
        <button class="location-button" id="locationButton" type="button" aria-label="내 위치로 이동" title="내 위치로 이동">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="12" cy="12" r="8"></circle><path d="M12 2V4M12 20v2M2 12h2M20 12h2"></path></svg>
        </button>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="merchantTemplate">
    <article class="merchant-card">
      <button type="button" class="merchant-card-button">
        <span class="merchant-icon" aria-hidden="true"></span>
        <span class="merchant-copy">
          <span class="merchant-head"><strong></strong></span>
          <span class="category"></span>
          <span class="address"></span>
        </span>
        <span class="distance"></span>
      </button>
      <div class="merchant-phones" hidden><a class="merchant-phone" hidden></a></div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="./merchant-phones.js"></script>
  <script src="./merchant-reviewed-phones.js"></script>
  <script src="./app.js"></script>
</body>
</html>
